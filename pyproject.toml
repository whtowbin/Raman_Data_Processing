[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hyper-raman"
dynamic = ["version"]
description = "Calibrate raw spectrometer images from a line-scanning Raman microscope (work in progress)"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
keywords = []
authors = [
  { name = "Henry Towbin", email = "24940778+whtowbin@users.noreply.github.com" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
  "xarray", "pandas", "numpy", "scipy", "matplotlib", "scikit-image", "numba", "tifffile"
]

[project.urls]
Documentation = "https://github.com/whtowbin/Raman_Data_Processing#readme"
Issues = "https://github.com/whtowbin/Raman_Data_Processing/issues"
Source = "https://github.com/whtowbin/Raman_Data_Processing"

[tool.hatch.version]
path = "src/hyper_raman/__about__.py"

[tool.hatch.envs.default]
type = "virtual"
installer = "uv"
python = "[3.13]"

dependencies = [
  "xarray", "pandas", "numpy", "scipy", "matplotlib", "scikit-image", "numba"
]

# The development TIFFs in src/hyper_raman/ stay in the repository but out of the package.
[tool.hatch.build]
exclude = ["*.tif", "*.tiff"]
